# Proxima workspace.
#
#   crates/core  - pure-Rust engine: flat index, HNSW, product quantization. No
#                  Python dependency, so it is directly `cargo test`-able / benchable.
#   crates/py    - thin PyO3 binding layer exposed to Python as `proxima._core`.
[workspace]
members = ["crates/core", "crates/py"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Optimized builds: full inlining + LTO so the distance kernels vectorize well.
# (Pair with target-cpu=native in .cargo/config.toml.)
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
