<svg viewBox="0 0 1040 700" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8980"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8b7b0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="700" fill="#fcfcfb"/>

  <!-- ============ Python layer ============ -->
  <rect x="40" y="34" width="960" height="150" rx="10" fill="none" stroke="#e3e2dd" stroke-width="1.5"/>
  <text x="60" y="60" font-size="13" font-weight="700" fill="#52514e" letter-spacing="0.5">PYTHON</text>

  <!-- corpus -> embeddings -->
  <rect x="60" y="78" width="140" height="58" rx="8" fill="#f0efec" stroke="#d8d7d2" stroke-width="1.2"/>
  <text x="130" y="102" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Corpus</text>
  <text x="130" y="120" font-size="10.5" fill="#7a7972" text-anchor="middle">Wikipedia loader</text>

  <path d="M200,107 H236" stroke="#b8b7b0" stroke-width="1.5" marker-end="url(#arrowMuted)"/>

  <rect x="240" y="78" width="180" height="58" rx="8" fill="#f0efec" stroke="#d8d7d2" stroke-width="1.2"/>
  <text x="330" y="100" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Embeddings</text>
  <text x="330" y="118" font-size="10.5" fill="#7a7972" text-anchor="middle">sentence-transformers</text>
  <text x="330" y="131" font-size="9.5" fill="#9a988f" text-anchor="middle">(not part of the engine)</text>

  <path d="M420,107 H456" stroke="#b8b7b0" stroke-width="1.5" marker-end="url(#arrowMuted)"/>

  <!-- SemanticSearch / demo / bench, stacked pills -->
  <rect x="460" y="72" width="200" height="30" rx="15" fill="#ffffff" stroke="#d8d7d2" stroke-width="1.2"/>
  <text x="560" y="92" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">SemanticSearch</text>

  <rect x="460" y="108" width="200" height="30" rx="15" fill="#ffffff" stroke="#d8d7d2" stroke-width="1.2"/>
  <text x="560" y="128" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">Demo (FastAPI + UI)</text>

  <rect x="672" y="72" width="220" height="30" rx="15" fill="#ffffff" stroke="#d8d7d2" stroke-width="1.2"/>
  <text x="782" y="92" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">Bench harness</text>

  <rect x="672" y="108" width="220" height="30" rx="15" fill="#ffffff" stroke="#d8d7d2" stroke-width="1.2"/>
  <text x="782" y="128" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">CLI scripts</text>

  <text x="60" y="160" font-size="10.5" fill="#9a988f">numpy arrays (float32, C-contiguous) cross here ↓</text>

  <!-- ============ PyO3 bridge ============ -->
  <rect x="40" y="204" width="960" height="64" rx="10" fill="#eef4fc" stroke="#bcd6f4" stroke-width="1.4"/>
  <text x="60" y="230" font-size="13" font-weight="700" fill="#184f95" letter-spacing="0.3">PyO3 BINDINGS</text>
  <text x="60" y="250" font-size="11" fill="#33629f">searchforge._core — zero-copy numpy interop · GIL released around every search call</text>
  <text x="620" y="250" font-size="10.5" fill="#5c85bc" font-style="italic">crates/py</text>

  <path d="M520,268 V300" stroke="#8a8980" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ Rust core ============ -->
  <rect x="40" y="304" width="960" height="222" rx="10" fill="none" stroke="#2a78d6" stroke-width="1.8"/>
  <text x="60" y="330" font-size="13" font-weight="700" fill="#184f95" letter-spacing="0.5">RUST CORE — searchforge-core</text>
  <text x="60" y="348" font-size="10.5" fill="#7a7972">pure Rust, zero Python dependency — cargo test / cargo bench directly</text>

  <!-- FlatIndex -->
  <rect x="60" y="364" width="216" height="88" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.3"/>
  <text x="168" y="388" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">FlatIndex</text>
  <text x="168" y="406" font-size="10" fill="#52514e" text-anchor="middle">exact brute-force</text>
  <text x="168" y="420" font-size="10" fill="#52514e" text-anchor="middle">ground truth for HNSW recall</text>
  <text x="168" y="438" font-size="10" fill="#52514e" text-anchor="middle">metadata-filtered search</text>

  <!-- HnswIndex -->
  <rect x="292" y="364" width="216" height="88" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.3"/>
  <text x="400" y="388" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">HnswIndex</text>
  <text x="400" y="406" font-size="10" fill="#52514e" text-anchor="middle">the centerpiece</text>
  <text x="400" y="420" font-size="10" fill="#52514e" text-anchor="middle">parallel build · lock-free query</text>
  <text x="400" y="438" font-size="10" fill="#52514e" text-anchor="middle">metadata-filtered search</text>

  <!-- PqIndex -->
  <rect x="524" y="364" width="216" height="88" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.3"/>
  <text x="632" y="388" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">PqIndex</text>
  <text x="632" y="406" font-size="10" fill="#52514e" text-anchor="middle">product quantization</text>
  <text x="632" y="420" font-size="10" fill="#52514e" text-anchor="middle">k-means codebooks + ADC</text>
  <text x="632" y="438" font-size="10" fill="#52514e" text-anchor="middle">32x compression</text>

  <!-- distance kernels -->
  <rect x="756" y="364" width="224" height="88" rx="8" fill="#f5f5f3" stroke="#c7c6c0" stroke-width="1.3"/>
  <text x="868" y="388" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">distance.rs</text>
  <text x="868" y="406" font-size="10" fill="#52514e" text-anchor="middle">lane-parallel L2 / inner product</text>
  <text x="868" y="420" font-size="10" fill="#52514e" text-anchor="middle">auto-vectorizes: NEON / AVX</text>
  <text x="868" y="438" font-size="10" fill="#52514e" text-anchor="middle">shared by all three indexes</text>

  <!-- persistence bar -->
  <rect x="60" y="466" width="920" height="42" rx="8" fill="#f5f5f3" stroke="#c7c6c0" stroke-width="1.2"/>
  <text x="520" y="492" font-size="11" fill="#52514e" text-anchor="middle">persistence (serde + bincode) — every index saves/loads to disk; a 1M-vector HNSW graph loads in seconds, not minutes</text>

  <!-- connectors from the Rust-core boundary down to the two satellites -->
  <path d="M168,526 V556" stroke="#1baf7a" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M860,526 V556" stroke="#b8b7b0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>

  <!-- GPU path (satellite, outside the Rust-core border) -->
  <rect x="60" y="560" width="360" height="70" rx="8" fill="#e9f8f1" stroke="#1baf7a" stroke-width="1.4"/>
  <text x="240" y="585" font-size="12" font-weight="700" fill="#0b6b47" text-anchor="middle">CUDA kernel (feature-gated) — FFI</text>
  <text x="240" y="603" font-size="10" fill="#0b6b47" text-anchor="middle">one block/query · coalesced transposed reads</text>
  <text x="240" y="619" font-size="10" fill="#0b6b47" text-anchor="middle" font-weight="600">RTX 4070 Ti: 18.9x over 8-core CPU, exact</text>

  <!-- FAISS comparison (satellite, outside the Rust-core border) -->
  <rect x="680" y="560" width="300" height="70" rx="8" fill="#ffffff" stroke="#c7c6c0" stroke-width="1.3" stroke-dasharray="3,3"/>
  <text x="830" y="586" font-size="12" font-weight="700" fill="#52514e" text-anchor="middle">FAISS</text>
  <text x="830" y="604" font-size="10" fill="#7a7972" text-anchor="middle">benchmarked against on SIFT1M —</text>
  <text x="830" y="619" font-size="10" fill="#7a7972" text-anchor="middle">not a dependency of the engine</text>

  <text x="520" y="670" font-size="10.5" fill="#9a988f" text-anchor="middle">crates/core (pure Rust) · crates/py (PyO3) · python/searchforge (orchestration) · bench/ (harness + FAISS comparison)</text>
</svg>
