name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p proxima-core --release

  python:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            venv_bin: .venv/bin
          - os: windows-latest
            venv_bin: .venv/Scripts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m venv .venv
      - name: Put the virtualenv on PATH
        shell: bash
        run: |
          echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> "$GITHUB_ENV"
          echo "${{ github.workspace }}/${{ matrix.venv_bin }}" >> "$GITHUB_PATH"
      - run: pip install maturin pytest
      - run: maturin develop --release
      - run: pytest tests/ -q
