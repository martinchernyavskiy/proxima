[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "proxima"
version = "0.1.0"
description = "A from-scratch, GPU-accelerable vector search engine, demonstrated through semantic search."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=2.2", "torch", "datasets"]
demo = ["fastapi", "uvicorn[standard]"]
bench = ["faiss-cpu", "matplotlib"]

[tool.maturin]
manifest-path = "crates/py/Cargo.toml"
python-source = "python"
module-name = "proxima._core"
