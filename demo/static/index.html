<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SearchForge — semantic search</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #131a23; --panel2: #0f151c;
    --border: #223040; --text: #e6edf3; --muted: #8b9bb0; --accent: #4aa8ff;
    --accent2: #7cf3c3; --chip: #1b2632;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #16202c, var(--bg));
    color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 56px 20px 80px; }
  .brand { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  h1 { font-size: 30px; margin: 0; letter-spacing: -0.5px; }
  h1 .fg { color: var(--accent); } h1 .sg { color: var(--accent2); }
  .tag { color: var(--muted); font-size: 14px; }
  .sub { color: var(--muted); margin: 0 0 26px; font-size: 14px; }
  .searchbar { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 14px 16px; font-size: 16px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(74,168,255,.15); }
  button {
    background: var(--accent); color: #04121f; border: 0; border-radius: 12px;
    padding: 0 22px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 2px 4px; min-height: 24px; }
  .chip { background: var(--chip); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 3px 11px; font-size: 12.5px; }
  .chip b { color: var(--text); font-weight: 600; }
  .chip.lat b { color: var(--accent2); }
  .examples { margin: 6px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .ex { cursor: pointer; color: var(--accent); font-size: 13px; background: none; padding: 4px 0; border: 0; }
  .ex:hover { text-decoration: underline; }
  .results { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .card .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .card .title { font-size: 16px; font-weight: 600; color: var(--text); text-decoration: none; }
  .card .title:hover { color: var(--accent); }
  .card .score { font-variant-numeric: tabular-nums; color: var(--accent2); font-size: 13px; white-space: nowrap; }
  .card .snip { color: var(--muted); margin-top: 6px; font-size: 14px; }
  .card .rank { color: #54637a; font-size: 12px; margin-right: 8px; }
  .empty { color: var(--muted); padding: 20px 2px; }
  .foot { color: #54637a; font-size: 12px; margin-top: 36px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <h1><span class="fg">Search</span><span class="sg">Forge</span></h1>
      <span class="tag">semantic vector search</span>
    </div>
    <p class="sub">Search by <b>meaning</b>, not keywords — a from-scratch Rust vector search engine over Wikipedia.</p>

    <div class="searchbar">
      <input id="q" type="text" placeholder="e.g. a quiet beach town in southern Europe" autocomplete="off" />
      <button id="go">Search</button>
    </div>

    <div class="examples" id="examples"></div>
    <div class="meta" id="meta"></div>
    <div class="results" id="results"></div>

    <div class="foot" id="foot"></div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const EXAMPLES = [
  "how do airplanes stay in the air",
  "ancient empires of the mediterranean",
  "famous classical music composers",
  "diseases caused by viruses",
];

async function info() {
  try {
    const r = await fetch("/api/info");
    const d = await r.json();
    $("foot").textContent =
      `Index: ${d.index} · ${d.count.toLocaleString()} docs · ${d.dim}-dim embeddings (${d.model}) · ${d.memory_mb} MB · metric ${d.metric}`;
  } catch (e) {}
}

function renderExamples() {
  const box = $("examples");
  box.innerHTML = "Try: ";
  EXAMPLES.forEach((ex, i) => {
    const b = document.createElement("button");
    b.className = "ex"; b.textContent = ex;
    b.onclick = () => { $("q").value = ex; run(); };
    box.appendChild(b);
    if (i < EXAMPLES.length - 1) box.appendChild(document.createTextNode(" · "));
  });
}

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

async function run() {
  const q = $("q").value.trim();
  if (!q) return;
  $("go").disabled = true;
  $("meta").innerHTML = `<span class="chip">searching…</span>`;
  $("results").innerHTML = "";
  try {
    const r = await fetch(`/api/search?q=${encodeURIComponent(q)}&k=10`);
    const d = await r.json();
    $("meta").innerHTML =
      `<span class="chip lat">search <b>${d.latency_ms.toFixed(2)} ms</b></span>` +
      `<span class="chip">over <b>${d.count.toLocaleString()}</b> docs</span>` +
      `<span class="chip"><b>${d.results.length}</b> results</span>`;
    if (!d.results.length) { $("results").innerHTML = `<div class="empty">No results.</div>`; return; }
    $("results").innerHTML = d.results.map(x => `
      <div class="card">
        <div class="top">
          <a class="title" href="${x.url || '#'}" target="_blank" rel="noopener"><span class="rank">${x.rank}</span>${esc(x.title)}</a>
          <span class="score">${x.score.toFixed(3)}</span>
        </div>
        <div class="snip">${esc(x.text)}</div>
      </div>`).join("");
  } catch (e) {
    $("meta").innerHTML = `<span class="chip">error: ${esc(String(e))}</span>`;
  } finally {
    $("go").disabled = false;
  }
}

$("go").onclick = run;
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });
renderExamples();
info();
$("q").focus();
</script>
</body>
</html>
