[package]
name = "proxima-py"
description = "Python bindings for the Proxima engine."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Imported from Python as `proxima._core`.
name = "_core"
crate-type = ["cdylib"]

[dependencies]
proxima-core = { path = "../core" }
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
